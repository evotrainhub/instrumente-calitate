<html lang="ro">
<head>
<meta charset="utf-8">

<title>Diagrama afinității – live</title>

<style>
:root{
  --bg:#f3f1ff; --panel:#ffffff; --ink:#1e1b3a; --muted:#625f80; --line:#e4e0f5;
  --accent:#5b3df5; --accent2:#e5368f; --accent-ink:#ffffff; --accent-soft:#ece8ff; --warn:#d6334f; --warn-soft:#ffe4ea;
  --grad:linear-gradient(120deg,#5b3df5 0%,#9b3cf0 50%,#e5368f 100%);
  --radius:12px; --shadow:0 1px 2px rgba(60,40,140,.06),0 6px 20px rgba(60,40,140,.08);
  --cM:#2563eb; --cP:#10b981; --cA:#f59e0b; --cI:#94a3b8; --cR:#ef4444; --cQ:#a855f7;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg) radial-gradient(1200px 500px at 100% -10%,#ffe3f1 0%,transparent 60%) no-repeat,radial-gradient(900px 500px at -10% 0%,#e3e0ff 0%,transparent 60%) no-repeat;background-color:var(--bg);color:var(--ink);font:15px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{line-height:1.2;margin:0 0 .4em;font-weight:650;letter-spacing:-.01em}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:.3em 0 .8em}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--grad);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 4px 18px rgba(91,61,245,.25)}
.top .muted{color:#ffffffcc}
.top .brand{font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.top .brand .dot{width:12px;height:12px;border-radius:4px;background:#fff;box-shadow:0 0 0 3px #ffffff55}
.top .sp{flex:1}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge.demo{background:#fff3c4;color:#8a5a00}
.top .badge{background:#ffffff26;color:#fff}.top .badge.demo{background:#fff3c4;color:#8a5a00}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack>*+*{margin-top:12px}
.muted{color:var(--muted)} .small{font-size:.85rem}
label{font-weight:600;font-size:.88rem;display:block;margin-bottom:4px}
input[type=text],textarea,select{width:100%;font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:70px}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
button:hover{border-color:#c7c1b6}
button.primary{background:var(--grad);border-color:transparent;color:var(--accent-ink);box-shadow:0 3px 10px rgba(155,60,240,.3)}
button.primary:hover{filter:brightness(1.08)}
button.danger{color:var(--warn)} button.danger:hover{border-color:var(--warn)}
button.ghost{border-color:transparent;background:transparent;padding:6px 8px}
button.ghost:hover{background:#0000000a}
button:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:10px 12px;color:var(--muted)}
.tabs button.on{color:var(--accent);border-bottom:3px solid var(--accent2)}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.9rem;font-weight:800;letter-spacing:.18em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.linkbox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;word-break:break-all}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:650}
.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll-x{overflow-x:auto}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}
.switch{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem;cursor:pointer;user-select:none}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;transition:.25s;pointer-events:none;z-index:99}
#toast.show{opacity:1;transform:translateX(-50%)}
.hero{max-width:560px;margin:8vh auto 0}
.hero .card{padding:26px;border-top:5px solid transparent;border-image:var(--grad) 1;border-radius:0 0 var(--radius) var(--radius)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.78rem;font-weight:700;color:#fff}
@media (max-width:640px){ .codebox{font-size:1.5rem} h1{font-size:1.35rem} }

.wrap{max-width:1400px}
.stepper{display:flex;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.stepper button{border:none;border-radius:0;padding:9px 14px;border-right:1px solid var(--line);color:var(--muted)}
.stepper button:last-child{border-right:none}
.stepper button.on{background:var(--grad);color:#fff}
.stepper button .n{display:inline-flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;font-size:.75rem;background:#0000000d;margin-right:4px}
.stepper button.on .n{background:#ffffff33}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.note{background:#fff3a3;border:1px solid #f2d94a;border-radius:8px;transform:rotate(-.4deg);padding:10px 12px 8px;box-shadow:0 1px 2px #0000000f,0 3px 8px #0000000a;font-size:.93rem;line-height:1.35;position:relative;word-wrap:break-word;min-height:58px}
.note.mine{box-shadow:0 0 0 2px #5b3df5,0 3px 8px #0000001a}
.note:nth-child(even){transform:rotate(.5deg)}
.note .by{font-size:.72rem;color:#00000080;margin-top:6px;display:flex;gap:4px;align-items:center}
.note .acts{position:absolute;top:2px;right:2px;display:none;gap:0}
.note:hover .acts{display:flex}
.note .acts button{padding:2px 6px;font-size:.78rem;border:none;background:transparent;color:#00000099}
.note .acts button:hover{background:#00000010}
.note.new{animation:pop .35s ease}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.compose{display:flex;gap:10px;align-items:flex-end}
.compose textarea{min-height:52px;flex:1}
.board{display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start}
.col{background:#e9e5fb;border-radius:10px;padding:10px;min-height:120px;transition:background .15s,box-shadow .15s}
.col.over{background:#ddd5ff;box-shadow:inset 0 0 0 2px var(--accent)}
.col .notes{display:flex;flex-direction:column;gap:8px;min-height:40px}
.col.unplaced{position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto}
.col.unplaced h3{display:flex;justify-content:space-between}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;align-items:start}
.group{background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 0 10px;box-shadow:var(--shadow)}
.group .gh{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 10px;border-radius:10px 10px 0 0;background:var(--gc,#5b3df5);color:#fff}
.group .gh input{color:#fff}.group .gh input::placeholder{color:#ffffffb0}.group .gh input:focus{color:var(--ink)}.group .gh .cnt{color:#fff!important;background:#ffffff33;border-radius:99px;padding:1px 8px!important}.group .gh button{color:#fff}
.group{border-top:none!important;border-color:color-mix(in srgb,var(--gc) 30%,#fff)!important}
.group .gh input{flex:1;min-width:0;border:none;background:transparent;font-weight:700;padding:4px 6px;font-size:.95rem}
.group .gh input:focus{background:#fff;box-shadow:0 0 0 2px var(--accent-soft)}
.group .gh .cnt{font-size:.75rem;color:var(--muted);font-weight:700;padding:0 4px}
.group .notes{padding:10px 10px 0;display:flex;flex-direction:column;gap:8px;min-height:60px}
.group.over{box-shadow:inset 0 0 0 2px var(--accent),var(--shadow)}
.newgroup{border:2px dashed #b9a2f7;color:var(--accent)!important;border-radius:10px;min-height:110px;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;color:var(--muted);font-weight:600;cursor:pointer;text-align:center;padding:12px;background:transparent}
.newgroup.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.board .note{cursor:grab;min-height:0}
.board .note.sel{outline:3px solid var(--accent);outline-offset:1px}
.board .note.dragging{opacity:.4}
.board.ro .note{cursor:default}
.teampick{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.teampick button{flex-direction:column;align-items:flex-start;padding:16px;gap:4px;white-space:normal;text-align:left}
.teampick button b{font-size:1.1rem}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.cmp .g{margin:10px 0;padding-left:10px;border-left:4px solid var(--gc)}
.cmp .g b{display:block}
.cmp .g li{font-size:.88rem}
.hint{background:linear-gradient(120deg,#ece8ff,#ffe4f1);border-radius:10px;padding:10px 14px;font-size:.9rem}
.members{display:flex;gap:6px;flex-wrap:wrap}
.members span{font-size:.78rem;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.countdown{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:2.6rem;font-weight:800;line-height:1.1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.countdown.urgent{background:none;color:#ef4444;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
.case h1{font-size:1.35rem}
@media (max-width:760px){.board{grid-template-columns:1fr}.col.unplaced{position:static;max-height:none}}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><span class="dot"></span>Diagrama afinității</div>
  <span id="sessTitle" class="muted small"></span>
  <span class="sp"></span>
  <span id="modeBadge"></span>
</div>
<main class="wrap" id="app"></main>

<script>
// ================= STOCARE: Firebase Realtime Database sau mod demo local =================
// Pentru utilizare reală cu participanții: lipiți aici configurația proiectului Firebase
// (Firebase Console → Project settings → Your apps → Web app → firebaseConfig).
// Lăsat null → MOD DEMO: funcționează doar între taburile aceluiași browser (pentru testare).
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBQstRJQTo3wgBo6M720GR65NnqXbDPsGw",
  authDomain: "instrumente-curs-smc.firebaseapp.com",
  databaseURL: "https://instrumente-curs-smc-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "instrumente-curs-smc",
  storageBucket: "instrumente-curs-smc.firebasestorage.app",
  messagingSenderId: "673990668693",
  appId: "1:673990668693:web:167c496ca2bb36a716869c"
};
/* Exemplu:
const FIREBASE_CONFIG = {
  apiKey: "AIza...",
  authDomain: "proiectul-meu.firebaseapp.com",
  databaseURL: "https://proiectul-meu-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "proiectul-meu",
  appId: "1:...:web:..."
};
*/

function createStore(prefix) {
  if (FIREBASE_CONFIG && window.firebase && firebase.database) {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.database();
    const P = p => prefix + '/' + p;
    let offset = 0; db.ref('.info/serverTimeOffset').on('value', s => { offset = s.val() || 0; });
    return {
      mode: 'firebase',
      on(path, cb) { const r = db.ref(P(path)); const h = s => cb(s.val()); r.on('value', h); return () => r.off('value', h); },
      get(path) { return db.ref(P(path)).get().then(s => s.val()); },
      set(path, v) { return db.ref(P(path)).set(v); },
      update(path, obj) { return db.ref(P(path)).update(obj); },
      remove(path) { return db.ref(P(path)).remove(); },
      newKey() { return db.ref().push().key; },
      onConnection(cb) { db.ref('.info/connected').on('value', s => cb(!!s.val())); },
      now() { return Date.now() + offset; }
    };
  }
  // ---------- mod demo: localStorage + evenimentul 'storage' între taburi ----------
  const KEY = 'demo_db_' + prefix;
  const listeners = new Set();
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
  const parts = p => p.split('/').filter(Boolean);
  const getAt = (obj, p) => parts(p).reduce((o, k) => (o == null ? undefined : o[k]), obj);
  const prune = o => { if (o && typeof o === 'object') { for (const k of Object.keys(o)) { if (o[k] === null || o[k] === undefined) delete o[k]; else { prune(o[k]); if (o[k] && typeof o[k] === 'object' && !Object.keys(o[k]).length) delete o[k]; } } } return o; };
  const setAt = (obj, p, v) => {
    const ks = parts(p); if (!ks.length) return v;
    let o = obj; for (let i = 0; i < ks.length - 1; i++) { if (typeof o[ks[i]] !== 'object' || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]]; }
    o[ks[ks.length - 1]] = (v === undefined ? null : JSON.parse(JSON.stringify(v)));
    return obj;
  };
  const write = db => { try { localStorage.setItem(KEY, JSON.stringify(prune(db))); } catch (e) { alert('Stocare locală indisponibilă.'); } notify(); };
  const notify = () => { const db = read(); listeners.forEach(l => { const v = getAt(db, l.path); l.cb(v === undefined ? null : JSON.parse(JSON.stringify(v))); }); };
  window.addEventListener('storage', e => { if (e.key === KEY) notify(); });
  return {
    mode: 'demo',
    on(path, cb) { const l = { path, cb }; listeners.add(l); setTimeout(() => { const v = getAt(read(), path); cb(v === undefined ? null : v); }, 0); return () => listeners.delete(l); },
    get(path) { const v = getAt(read(), path); return Promise.resolve(v === undefined ? null : v); },
    set(path, v) { write(setAt(read(), path, v)); return Promise.resolve(); },
    update(path, obj) { let db = read(); for (const k of Object.keys(obj)) db = setAt(db, path + '/' + k, obj[k]); write(db); return Promise.resolve(); },
    remove(path) { write(setAt(read(), path, null)); return Promise.resolve(); },
    newKey() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); },
    onConnection(cb) { cb(true); },
    now() { return Date.now(); }
  };
}

// ================= utilitare comune =================
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const genCode = () => { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 5; i++) s += a[Math.floor(Math.random() * a.length)]; return s; };
const genToken = () => Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
const lsGet = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } };
const clientId = (() => { let id = lsGet('client_id', null); if (!id) { id = genToken().slice(0, 14); lsSet('client_id', id); } return id; })();
const params = new URLSearchParams(location.search);
const baseUrl = () => location.origin + location.pathname;

// Păstrează focusul și textul tastat când o zonă e redesenată din cauza unei actualizări live
function preserveFocus(fn) {
  const a = document.activeElement;
  const id = a && a.id && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') ? a.id : null;
  const val = id ? a.value : null, s = id ? a.selectionStart : null, e = id ? a.selectionEnd : null;
  fn();
  if (id) { const n = document.getElementById(id); if (n) { n.value = val; n.focus(); try { n.setSelectionRange(s, e); } catch (_) { } } }
}

function toast(msg) {
  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
}
function copyText(txt) {
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Copiat în clipboard')).catch(() => { prompt('Copiați linkul:', txt); });
}
function download(name, text, type = 'text/csv;charset=utf-8') {
  const b = new Blob(['﻿' + text], { type }); const u = URL.createObjectURL(b);
  const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000);
}
const csvCell = v => { const s = String(v ?? ''); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const toCSV = rows => rows.map(r => r.map(csvCell).join(';')).join('\n');
const debounce = (fn, ms) => { let h; return (...a) => { clearTimeout(h); h = setTimeout(() => fn(...a), ms); }; };


const COLORS = ['#5b3df5', '#e5368f', '#f59e0b', '#10b981', '#0ea5e9', '#ef4444', '#a855f7', '#14b8a6', '#f97316', '#2563eb'];
const NOTE_COLORS = [['#fff3a3', '#f2d94a'], ['#ffd1e8', '#f59ac8'], ['#c9f7e1', '#7fdcb4'], ['#cfe8ff', '#8cc4f7'], ['#ffdcc2', '#f7ab78'], ['#e4d9ff', '#b9a2f7']];
const noteColor = by => { let h = 0; for (const ch of String(by || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return NOTE_COLORS[h % NOTE_COLORS.length]; };
const PHASES = [['pregatire', 'Pregătire'], ['idei', 'Scriere individuală'], ['grupare', 'Grupare împreună'], ['final', 'Rezultat']];
const PRESET_TOPIC = 'Organizarea conferinței internaționale „Transformarea digitală și sustenabilitatea în producție”';
const PRESET_DESC = 'Sunteți membri ai comitetului de organizare al conferinței internaționale „Transformarea digitală și sustenabilitatea în producție”, care va avea loc la Romexpo, vineri–duminică, 11–13 decembrie 2026.\nNotați toate aspectele de care trebuie să ținem cont pentru o bună organizare a conferinței – câte un aspect pe bilețel. Fiecare scrie cel puțin o idee.';
const BOARD = 't1';

const store = createStore('afinitate');
const code = (params.get('s') || '').toUpperCase().trim();
const adminToken = params.get('admin');
let S = null, isAdmin = false, showTexts = false;
let dragging = false, pending = false, selected = null, lastPhase = null;
const seen = new Set(); let firstPaint = true;

$('#modeBadge').innerHTML = store.mode === 'demo'
  ? '<span class="badge demo" title="Fără Firebase: datele se sincronizează doar între taburile acestui browser">Mod demo local – participanții NU se pot conecta</span>'
  : '<span class="badge" id="conn">● conectat</span>';
if (store.mode === 'firebase') store.onConnection(ok => { const c = $('#conn'); if (c) { c.textContent = ok ? '● conectat' : '○ reconectare…'; c.className = ok ? 'badge' : 'badge demo'; } });

const P = p => 'sessions/' + code + (p ? '/' + p : '');
const ideasList = () => Object.entries(S.ideas || {}).map(([id, x]) => ({ id, ...x })).sort((a, b) => (a.at || 0) - (b.at || 0));
const members = () => Object.entries(S.members || {}).map(([id, m]) => ({ id, ...m })).sort((a, b) => (a.at || 0) - (b.at || 0));
const me = () => (S.members || {})[clientId];
const groups = () => Object.entries(((S.boards || {})[BOARD] || {}).groups || {}).map(([id, g]) => ({ id, ...g })).sort((a, b) => (a.order || 0) - (b.order || 0));
const place = () => (((S.boards || {})[BOARD] || {}).place) || {};
const remaining = () => S.meta.timerEnd ? Math.max(0, S.meta.timerEnd - store.now()) : 0;
// Etapa efectivă: când cronometrul expiră, ideile devin vizibile pentru toți chiar dacă formatorul nu a apăsat nimic
const phase = () => { const p = S.meta.phase || 'pregatire'; return (p === 'idei' && S.meta.timerEnd && remaining() <= 0) ? 'grupare' : p; };
const fmtTime = ms => { const s = Math.ceil(ms / 1000), m = Math.floor(s / 60); return m + ':' + String(s % 60).padStart(2, '0'); };

function render() {
  if (dragging) { pending = true; return; }
  lastPhase = phase();
  preserveFocus(() => isAdmin ? renderAdmin() : renderParticipant());
  firstPaint = false;
  tick();
}

// cronometrul: actualizează afișajul și trece automat la grupare la expirare
function tick() {
  if (!S || !S.meta) return;
  const r = remaining();
  $$('.countdown').forEach(el => { el.textContent = fmtTime(r); el.classList.toggle('urgent', r > 0 && r <= 30000); });
  if (phase() !== lastPhase) render();
  if (isAdmin && S.meta.phase === 'idei' && S.meta.timerEnd && r <= 0) store.update(P('meta'), { phase: 'grupare' });
}

const caseHTML = (compact) => `<div class="card case"><div class="small muted">Studiu de caz · cod ${code}</div><h1 style="margin-top:4px">${esc(S.meta.topic)}</h1>${S.meta.desc && !compact ? `<p style="white-space:pre-line">${esc(S.meta.desc)}</p>` : ''}</div>`;

function noteHTML(x, opts = {}) {
  const mine = x.by === clientId, isNew = !firstPaint && !seen.has(x.id); seen.add(x.id);
  const canEdit = opts.editable && (mine || isAdmin);
  const showBy = (S.meta.showAuthors || isAdmin) && x.name;
  const [nb, nl] = noteColor(x.by);
  return `<div class="note ${mine ? 'mine' : ''} ${isNew ? 'new' : ''} ${selected === x.id ? 'sel' : ''}" data-id="${x.id}" style="background:${nb};border-color:${nl}" ${opts.drag ? 'draggable="true"' : ''}>
    ${esc(x.text)}${showBy ? `<div class="by">— ${esc(x.name)}</div>` : ''}
    ${canEdit ? `<div class="acts"><button data-edit="${x.id}" title="Modifică">✎</button><button data-del="${x.id}" title="Șterge">✕</button></div>` : ''}</div>`;
}

function bindNoteActions(root) {
  $$('[data-edit]', root).forEach(b => b.onclick = e => { e.stopPropagation(); const x = S.ideas[b.dataset.edit]; const t = prompt('Modificați ideea:', x.text); if (t != null && t.trim()) store.update(P('ideas/' + b.dataset.edit), { text: t.trim().slice(0, 140) }); });
  $$('[data-del]', root).forEach(b => b.onclick = e => { e.stopPropagation(); if (confirm('Ștergeți ideea?')) store.update(P(''), { ['ideas/' + b.dataset.del]: null, ['boards/' + BOARD + '/place/' + b.dataset.del]: null }); });
}

function composeHTML() {
  return `<form id="cf" class="compose"><div style="flex:1"><label for="newIdea">Ideea ta</label><textarea id="newIdea" maxlength="140" placeholder="ex. Transport între aeroport și Romexpo pentru invitații străini"></textarea></div><button class="primary" style="height:52px">Adaugă</button></form>
    <p class="small muted" style="margin:6px 0 0">Enter = trimite · Shift+Enter = rând nou · câte o idee pe bilețel</p>`;
}
function bindCompose() {
  const f = $('#cf'); if (!f) return;
  const send = () => { const t = $('#newIdea').value.trim(); if (!t) return; const name = isAdmin ? 'Formator' : ((me() && me().name) || ''); store.set(P('ideas/' + store.newKey()), { text: t.slice(0, 140), by: clientId, name, at: Date.now() }); $('#newIdea').value = ''; $('#newIdea').focus(); };
  f.onsubmit = e => { e.preventDefault(); send(); };
  $('#newIdea').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
}

function boardHTML(editable) {
  const ideas = ideasList(), gs = groups(), pl = place(), gids = new Set(gs.map(g => g.id));
  const inG = gid => ideas.filter(x => pl[x.id] === gid);
  const unplaced = ideas.filter(x => !gids.has(pl[x.id]));
  const nopt = { drag: editable, editable: false };
  return `<div class="board ${editable ? '' : 'ro'}">
    <div class="col unplaced" data-drop="__none"><h3>Neclasificate <span class="muted small">${unplaced.length}</span></h3><div class="notes">${unplaced.map(x => noteHTML(x, nopt)).join('') || '<p class="small muted" style="text-align:center">Toate ideile au fost grupate ✓</p>'}</div></div>
    <div class="groups">
      ${gs.map((g, i) => `<div class="group" data-drop="${g.id}" style="--gc:${g.color || COLORS[i % COLORS.length]}">
        <div class="gh">${editable ? `<input type="text" id="gt_${g.id}" data-gt="${g.id}" value="${esc(g.title || '')}" placeholder="Numele categoriei…">` : `<b style="padding:4px 6px;flex:1">${esc(g.title || 'Fără titlu')}</b>`}<span class="cnt">${inG(g.id).length}</span>${editable ? `<button class="ghost small" data-delg="${g.id}" title="Desființează categoria (ideile revin la neclasificate)">✕</button>` : ''}</div>
        <div class="notes">${inG(g.id).map(x => noteHTML(x, nopt)).join('')}</div></div>`).join('')}
      ${editable ? `<div class="newgroup" data-drop="__new"><span>＋ Categorie nouă</span><span class="small" style="font-weight:400">clic aici sau trageți o idee aici</span></div>` : ''}
      ${!gs.length && !editable ? '<div class="empty">Nu a fost creată nicio categorie.</div>' : ''}
    </div></div>`;
}

function bindBoard(root) {
  const board = $('.board', root); if (!board || board.classList.contains('ro')) return;
  const bp = 'boards/' + BOARD;
  const moveTo = (id, target) => {
    if (target === '__none') store.remove(P(bp + '/place/' + id));
    else if (target === '__new') newGroup(id);
    else store.set(P(bp + '/place/' + id), target);
  };
  $$('.note', board).forEach(n => {
    n.addEventListener('dragstart', e => { dragging = true; e.dataTransfer.setData('text/plain', n.dataset.id); e.dataTransfer.effectAllowed = 'move'; setTimeout(() => n.classList.add('dragging'), 0); });
    n.addEventListener('dragend', () => { n.classList.remove('dragging'); dragging = false; $$('.over').forEach(o => o.classList.remove('over')); if (pending) { pending = false; render(); } });
    n.addEventListener('click', e => { e.stopPropagation(); selected = selected === n.dataset.id ? null : n.dataset.id; $$('.note.sel', board).forEach(x => x.classList.remove('sel')); if (selected) n.classList.add('sel'); });
  });
  $$('[data-drop]', board).forEach(z => {
    z.addEventListener('dragover', e => { e.preventDefault(); z.classList.add('over'); });
    z.addEventListener('dragleave', e => { if (!z.contains(e.relatedTarget)) z.classList.remove('over'); });
    z.addEventListener('drop', e => { e.preventDefault(); z.classList.remove('over'); const id = e.dataTransfer.getData('text/plain'); dragging = false; if (id) moveTo(id, z.dataset.drop); });
    z.addEventListener('click', e => { if (e.target.closest('input,button')) return; if (selected) { const id = selected; selected = null; moveTo(id, z.dataset.drop); } else if (z.dataset.drop === '__new') newGroup(); });
  });
  $$('[data-gt]', board).forEach(inp => inp.oninput = debounce(() => store.update(P(bp + '/groups/' + inp.dataset.gt), { title: inp.value.trim().slice(0, 60) }), 500));
  $$('[data-delg]', board).forEach(b => b.onclick = e => { e.stopPropagation(); const gid = b.dataset.delg, upd = { ['groups/' + gid]: null };
    Object.entries(place()).forEach(([iid, g]) => { if (g === gid) upd['place/' + iid] = null; }); store.update(P(bp), upd); });
}

function newGroup(ideaId) {
  const gs = groups(), gid = store.newKey(), order = gs.length ? Math.max(...gs.map(g => g.order || 0)) + 1 : 1;
  const upd = { ['groups/' + gid]: { title: '', order, color: COLORS[gs.length % COLORS.length] } };
  if (ideaId) upd['place/' + ideaId] = gid;
  store.update(P('boards/' + BOARD), upd).then(() => setTimeout(() => { const i = document.getElementById('gt_' + gid); if (i) i.focus(); }, 60));
}

const chipsHTML = () => `<div class="members">${members().map(m => `<span>${esc(m.name)}</span>`).join('') || '<span class="muted">nimeni încă</span>'}</div>`;
const groupingHint = `<div class="hint" style="margin-bottom:14px"><b>Lucrăm toți împreună, pe aceeași tablă.</b> 1) Trageți bilețelele care „seamănă” în aceeași categorie (sau: clic pe bilețel → clic pe categorie). 2) Creați categorii noi cu „＋ Categorie nouă”. 3) Dați fiecărei categorii un nume care exprimă ideea comună. Toată lumea vede modificările în timp real.</div>`;

  } else if (ph === 'grupare') {

  $('#delS').onclick = () => { if (confirm('Ștergeți definitiv sesiunea?')) { store.remove(P('')); lsSet('af_my', lsGet('af_my', []).filter(x => x.code !== code)); location.href = '?prof'; } };
}

function startTimer() { store.update(P('meta'), { phase: 'idei', timerEnd: store.now() + (S.meta.minutes || 5) * 60000 }); }

function exportCSV() {
  const ideas = S.ideas || {}, gs = groups(), pl = place(), gids = new Set(gs.map(g => g.id)), rows = [['Categorie', 'Idee', 'Autor']];
  gs.forEach(g => Object.keys(ideas).filter(id => pl[id] === g.id).forEach(id => rows.push([g.title || 'Fără titlu', ideas[id].text, ideas[id].name || ''])));
  Object.keys(ideas).filter(id => !gids.has(pl[id])).forEach(id => rows.push(['(neclasificată)', ideas[id].text, ideas[id].name || '']));
  download(`afinitate_${code}.csv`, toCSV(rows));
}
</script>
