<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chestionar Kano – live</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#f3f1ff; --panel:#ffffff; --ink:#1e1b3a; --muted:#625f80; --line:#e4e0f5;
  --accent:#5b3df5; --accent2:#e5368f; --accent-ink:#ffffff; --accent-soft:#ece8ff; --warn:#d6334f; --warn-soft:#ffe4ea;
  --grad:linear-gradient(120deg,#5b3df5 0%,#9b3cf0 50%,#e5368f 100%);
  --radius:12px; --shadow:0 1px 2px rgba(60,40,140,.06),0 6px 20px rgba(60,40,140,.08);
  --cM:#2563eb; --cP:#10b981; --cA:#f59e0b; --cI:#94a3b8; --cR:#ef4444; --cQ:#a855f7;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg) radial-gradient(1200px 500px at 100% -10%,#ffe3f1 0%,transparent 60%) no-repeat,radial-gradient(900px 500px at -10% 0%,#e3e0ff 0%,transparent 60%) no-repeat;background-color:var(--bg);color:var(--ink);font:15px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{line-height:1.2;margin:0 0 .4em;font-weight:650;letter-spacing:-.01em}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:.3em 0 .8em}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--grad);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 4px 18px rgba(91,61,245,.25)}
.top .muted{color:#ffffffcc}
.top .brand{font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.top .brand .dot{width:12px;height:12px;border-radius:4px;background:#fff;box-shadow:0 0 0 3px #ffffff55}
.top .sp{flex:1}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge.demo{background:#fff3c4;color:#8a5a00}
.top .badge{background:#ffffff26;color:#fff}.top .badge.demo{background:#fff3c4;color:#8a5a00}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack>*+*{margin-top:12px}
.muted{color:var(--muted)} .small{font-size:.85rem}
label{font-weight:600;font-size:.88rem;display:block;margin-bottom:4px}
input[type=text],textarea,select{width:100%;font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:70px}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
button:hover{border-color:#c7c1b6}
button.primary{background:var(--grad);border-color:transparent;color:var(--accent-ink);box-shadow:0 3px 10px rgba(155,60,240,.3)}
button.primary:hover{filter:brightness(1.08)}
button.danger{color:var(--warn)} button.danger:hover{border-color:var(--warn)}
button.ghost{border-color:transparent;background:transparent;padding:6px 8px}
button.ghost:hover{background:#0000000a}
button:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:10px 12px;color:var(--muted)}
.tabs button.on{color:var(--accent);border-bottom:3px solid var(--accent2)}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.9rem;font-weight:800;letter-spacing:.18em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.linkbox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;word-break:break-all}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:650}
.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll-x{overflow-x:auto}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}
.switch{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem;cursor:pointer;user-select:none}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;transition:.25s;pointer-events:none;z-index:99}
#toast.show{opacity:1;transform:translateX(-50%)}
.hero{max-width:560px;margin:8vh auto 0}
.hero .card{padding:26px;border-top:5px solid transparent;border-image:var(--grad) 1;border-radius:0 0 var(--radius) var(--radius)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.78rem;font-weight:700;color:#fff}
@media (max-width:640px){ .codebox{font-size:1.5rem} h1{font-size:1.35rem} }

.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.seg button{justify-content:center;white-space:normal;text-align:center;padding:9px 6px;font-size:.86rem;line-height:1.2;min-height:46px}
.seg button.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 3px 10px rgba(155,60,240,.3)}
.seg button:nth-child(1):hover{border-color:#10b981}.seg button:nth-child(5):hover{border-color:#ef4444}
.q{padding:14px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:none}
.qlabel{font-weight:600}
.qlabel .tag{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:block;margin-bottom:2px}
.attr-card{margin-bottom:14px}
.attr-card.done{border-color:#c9bdfc;box-shadow:0 0 0 2px #ece8ff,var(--shadow)}
.attr-head{display:flex;align-items:baseline;gap:10px}
.attr-num{font-weight:800;color:#fff;font-size:.95rem;background:var(--grad);width:28px;height:28px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress>div{height:100%;background:var(--grad);transition:width .3s}
.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:#eee;min-width:160px}
.bar span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:.72rem;font-weight:700;overflow:hidden}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.84rem}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.matrix{border-collapse:separate;border-spacing:4px;width:auto}
.matrix td,.matrix th{border:none;text-align:center;padding:6px}
.matrix td.cell{width:74px;height:56px;border-radius:8px;font-weight:700;position:relative}
.matrix td.cell .l{position:absolute;top:4px;left:6px;font-size:.72rem;opacity:.85}
.matrix td.cell .c{font-size:1.15rem}
.matrix th{font-size:.74rem;text-transform:none;letter-spacing:0;max-width:80px}
.attr-edit{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#fcfbf9}
.kpi{display:flex;gap:16px;flex-wrap:wrap}
.kpi .k{background:var(--bg);border-radius:10px;padding:10px 14px;min-width:120px}
.kpi .k b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.prop{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.prop span{flex:1}
@media (max-width:640px){.seg{grid-template-columns:1fr 1fr}.seg button{min-height:40px}}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><span class="dot"></span>Kano live</div>
  <span id="sessTitle" class="muted small"></span>
  <span class="sp"></span>
  <span id="modeBadge"></span>
</div>
<main class="wrap" id="app"></main>

<script>
// ================= STOCARE: Firebase Realtime Database sau mod demo local =================
// Pentru utilizare reală cu participanții: lipiți aici configurația proiectului Firebase
// (Firebase Console → Project settings → Your apps → Web app → firebaseConfig).
// Lăsat null → MOD DEMO: funcționează doar între taburile aceluiași browser (pentru testare).
const FIREBASE_CONFIG = null;
/* Exemplu:
const FIREBASE_CONFIG = {
  apiKey: "AIza...",
  authDomain: "proiectul-meu.firebaseapp.com",
  databaseURL: "https://proiectul-meu-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "proiectul-meu",
  appId: "1:...:web:..."
};
*/

function createStore(prefix) {
  if (FIREBASE_CONFIG && window.firebase && firebase.database) {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.database();
    const P = p => prefix + '/' + p;
    return {
      mode: 'firebase',
      on(path, cb) { const r = db.ref(P(path)); const h = s => cb(s.val()); r.on('value', h); return () => r.off('value', h); },
      get(path) { return db.ref(P(path)).get().then(s => s.val()); },
      set(path, v) { return db.ref(P(path)).set(v); },
      update(path, obj) { return db.ref(P(path)).update(obj); },
      remove(path) { return db.ref(P(path)).remove(); },
      newKey() { return db.ref().push().key; },
      onConnection(cb) { db.ref('.info/connected').on('value', s => cb(!!s.val())); }
    };
  }
  // ---------- mod demo: localStorage + evenimentul 'storage' între taburi ----------
  const KEY = 'demo_db_' + prefix;
  const listeners = new Set();
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
  const parts = p => p.split('/').filter(Boolean);
  const getAt = (obj, p) => parts(p).reduce((o, k) => (o == null ? undefined : o[k]), obj);
  const prune = o => { if (o && typeof o === 'object') { for (const k of Object.keys(o)) { if (o[k] === null || o[k] === undefined) delete o[k]; else { prune(o[k]); if (o[k] && typeof o[k] === 'object' && !Object.keys(o[k]).length) delete o[k]; } } } return o; };
  const setAt = (obj, p, v) => {
    const ks = parts(p); if (!ks.length) return v;
    let o = obj; for (let i = 0; i < ks.length - 1; i++) { if (typeof o[ks[i]] !== 'object' || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]]; }
    o[ks[ks.length - 1]] = (v === undefined ? null : JSON.parse(JSON.stringify(v)));
    return obj;
  };
  const write = db => { try { localStorage.setItem(KEY, JSON.stringify(prune(db))); } catch (e) { alert('Stocare locală indisponibilă.'); } notify(); };
  const notify = () => { const db = read(); listeners.forEach(l => { const v = getAt(db, l.path); l.cb(v === undefined ? null : JSON.parse(JSON.stringify(v))); }); };
  window.addEventListener('storage', e => { if (e.key === KEY) notify(); });
  return {
    mode: 'demo',
    on(path, cb) { const l = { path, cb }; listeners.add(l); setTimeout(() => { const v = getAt(read(), path); cb(v === undefined ? null : v); }, 0); return () => listeners.delete(l); },
    get(path) { const v = getAt(read(), path); return Promise.resolve(v === undefined ? null : v); },
    set(path, v) { write(setAt(read(), path, v)); return Promise.resolve(); },
    update(path, obj) { let db = read(); for (const k of Object.keys(obj)) db = setAt(db, path + '/' + k, obj[k]); write(db); return Promise.resolve(); },
    remove(path) { write(setAt(read(), path, null)); return Promise.resolve(); },
    newKey() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); },
    onConnection(cb) { cb(true); }
  };
}

// ================= utilitare comune =================
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const genCode = () => { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 5; i++) s += a[Math.floor(Math.random() * a.length)]; return s; };
const genToken = () => Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
const lsGet = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } };
const clientId = (() => { let id = lsGet('client_id', null); if (!id) { id = genToken().slice(0, 14); lsSet('client_id', id); } return id; })();
const params = new URLSearchParams(location.search);
const baseUrl = () => location.origin + location.pathname;

// Păstrează focusul și textul tastat când o zonă e redesenată din cauza unei actualizări live
function preserveFocus(fn) {
  const a = document.activeElement;
  const id = a && a.id && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') ? a.id : null;
  const val = id ? a.value : null, s = id ? a.selectionStart : null, e = id ? a.selectionEnd : null;
  fn();
  if (id) { const n = document.getElementById(id); if (n) { n.value = val; n.focus(); try { n.setSelectionRange(s, e); } catch (_) { } } }
}

function toast(msg) {
  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
}
function copyText(txt) {
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Copiat în clipboard')).catch(() => { prompt('Copiați linkul:', txt); });
}
function download(name, text, type = 'text/csv;charset=utf-8') {
  const b = new Blob(['﻿' + text], { type }); const u = URL.createObjectURL(b);
  const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000);
}
const csvCell = v => { const s = String(v ?? ''); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const toCSV = rows => rows.map(r => r.map(csvCell).join(';')).join('\n');
const debounce = (fn, ms) => { let h; return (...a) => { clearTimeout(h); h = setTimeout(() => fn(...a), ms); }; };


// ================= LOGICA KANO =================
const ANS = ['Îmi place', 'Mă aștept la asta', 'Indiferent', 'Acceptabil', 'Nu-mi place'];
// Tabelul de evaluare: rând = răspuns funcțional, coloană = răspuns disfuncțional
const TABLES = {
  curs: { name: 'Tabelul din curs (diagonala „Mă aștept / Acceptabil” = Q)', t: [
    ['Q', 'A', 'A', 'A', 'P'],
    ['R', 'Q', 'I', 'I', 'M'],
    ['R', 'I', 'I', 'I', 'M'],
    ['R', 'I', 'I', 'Q', 'M'],
    ['R', 'R', 'R', 'R', 'Q']] },
  berger: { name: 'Berger et al. (1993) – Q doar la contradicții', t: [
    ['Q', 'A', 'A', 'A', 'P'],
    ['R', 'I', 'I', 'I', 'M'],
    ['R', 'I', 'I', 'I', 'M'],
    ['R', 'I', 'I', 'I', 'M'],
    ['R', 'R', 'R', 'R', 'Q']] }
};
const CATS = {
  M: { n: 'De bază (Must-be)', c: 'var(--cM)', hex: '#2563eb' },
  P: { n: 'Performanță', c: 'var(--cP)', hex: '#10b981' },
  A: { n: 'Atractive', c: 'var(--cA)', hex: '#f59e0b' },
  I: { n: 'Indiferente', c: 'var(--cI)', hex: '#94a3b8' },
  R: { n: 'Reversibile', c: 'var(--cR)', hex: '#ef4444' },
  Q: { n: 'Îndoielnice', c: 'var(--cQ)', hex: '#a855f7' }
};
const CK = ['M', 'P', 'A', 'I', 'R', 'Q'];

const PRESET = [
  ['Cursuri online', 'Cum vi se pare faptul că centrul de formare oferă cursuri online?', 'Cum vi se pare faptul că centrul de formare nu oferă cursuri online?'],
  ['Camera formatorului deschisă', 'Ce impresie aveți dacă formatorul are camera video deschisă?', 'Ce impresie aveți dacă formatorul nu are camera video deschisă?'],
  ['Camera cursanților deschisă', 'Cum considerați folosirea camerei video din partea cursanților?', 'Cum considerați lipsa folosirii camerei video din partea cursanților?'],
  ['Implicarea activă a cursanților', 'Cum vă simțiți când formatorul vă implică activ în desfășurarea cursului?', 'Cum vă simțiți când formatorul nu vă implică activ în desfășurarea cursului?'],
  ['Suport de curs digital', 'Cum considerați primirea suportului de curs în format digital?', 'Cum considerați lipsa primirii suportului de curs în format digital?'],
  ['Înregistrarea sesiunilor', 'Cum vi se pare faptul că sesiunile sunt înregistrate și le puteți revedea?', 'Cum vi se pare faptul că sesiunile nu sunt înregistrate?'],
  ['Test interactiv zilnic', 'Cum vi se pare faptul că la finalul fiecărei zile există un test interactiv cu clasament?', 'Cum vi se pare faptul că nu există un test interactiv la finalul zilei?'],
  ['Pauze regulate', 'Cum vi se pare faptul că se fac pauze regulate, la fiecare oră?', 'Cum vi se pare faptul că nu se fac pauze regulate?']
];

const store = createStore('kano');
const code = (params.get('s') || '').toUpperCase().trim();
const adminToken = params.get('admin');
let S = null;          // starea sesiunii
let isAdmin = false;
let adminTab = lsGet('kano_tab', 'rez');
let matrixAttr = null;

$('#modeBadge').innerHTML = store.mode === 'demo'
  ? '<span class="badge demo" title="Fără Firebase: datele se sincronizează doar între taburile acestui browser">Mod demo local</span>'
  : '<span class="badge" id="conn">● conectat</span>';
if (store.mode === 'firebase') store.onConnection(ok => { const c = $('#conn'); if (c) { c.textContent = ok ? '● conectat' : '○ reconectare…'; c.className = ok ? 'badge' : 'badge demo'; } });

const sortedAttrs = s => Object.entries((s && s.attrs) || {}).map(([id, a]) => ({ id, ...a })).sort((a, b) => (a.order || 0) - (b.order || 0));
const tableOf = s => (TABLES[(s.meta && s.meta.table) || 'curs'] || TABLES.curs).t;

function computeStats(s) {
  const T = tableOf(s), attrs = sortedAttrs(s), resp = s.responses || {};
  return attrs.map(a => {
    const counts = { M: 0, P: 0, A: 0, I: 0, R: 0, Q: 0 }, mat = [0, 1, 2, 3, 4].map(() => [0, 0, 0, 0, 0]);
    let n = 0;
    for (const r of Object.values(resp)) {
      const x = r.answers && r.answers[a.id];
      if (!x || x.f == null || x.d == null) continue;
      n++; counts[T[x.f][x.d]]++; mat[x.f][x.d]++;
    }
    const max = Math.max(...CK.map(k => counts[k]));
    const pred = n ? CK.filter(k => counts[k] === max).join('/') : '—';
    const base = counts.A + counts.P + counts.M + counts.I;
    const better = base ? (counts.A + counts.P) / base : null;
    const worse = base ? -(counts.P + counts.M) / base : null;
    return { ...a, counts, n, pred, better, worse, mat };
  });
}

// ================= RUTARE =================
if (params.has('prof')) renderDashboard();
else if (code) {
  store.on('sessions/' + code, val => {
    S = val;
    if (!S || !S.meta) { $('#app').innerHTML = `<div class="hero"><div class="card"><h2>Sesiune inexistentă</h2><p class="muted">Codul <b>${esc(code)}</b> nu corespunde niciunei sesiuni. Verificați linkul primit de la formator.</p><a class="btn" href="${baseUrl()}">Înapoi</a></div></div>`; return; }
    isAdmin = !!adminToken && adminToken === S.meta.token;
    $('#sessTitle').textContent = S.meta.title || '';
    document.title = (S.meta.title || 'Kano') + ' – Kano live';
    preserveFocus(() => isAdmin ? renderAdmin() : renderParticipant());
  });
} else renderLanding();

// ================= PAGINĂ DE START =================
function renderLanding() {
  $('#app').innerHTML = `<div class="hero"><div class="card stack">
    <h1>Chestionar Kano</h1>
    <p class="muted">Introduceți codul sesiunii primit de la formator.</p>
    <form id="f" class="row"><input type="text" id="c" placeholder="ex. K7M2Q" maxlength="5" style="flex:1;text-transform:uppercase;letter-spacing:.15em;font-weight:700" autofocus><button class="primary">Intră</button></form>
    <p class="small muted" style="margin-top:22px">Sunteți formator? <a href="?prof">Zona formatorului →</a></p>
  </div></div>`;
  $('#f').onsubmit = e => { e.preventDefault(); const c = $('#c').value.trim().toUpperCase(); if (c) location.href = '?s=' + encodeURIComponent(c); };
}

// ================= PANOU FORMATOR (listă sesiuni) =================
function renderDashboard() {
  const mine = lsGet('kano_my', []);
  $('#app').innerHTML = `<div class="grid2">
    <div class="card stack"><h2>Sesiune nouă</h2>
      <div><label for="nt">Titlu</label><input type="text" id="nt" value="Kano – cursul online Manager SMC"></div>

// ================= PARTICIPANT =================
function renderParticipant() {
  const m = S.meta, attrs = sortedAttrs(S), me = (S.responses || {})[clientId] || {};
  const ans = me.answers || {};

  const myName = lsGet('kano_name', '');
  let h = `<div style="max-width:780px;margin:0 auto" class="stack">
   <div class="card"><h1>${esc(m.title)}</h1>${m.context ? `<p>${esc(m.context)}</p>` : ''}
     <div style="max-width:340px"><label for="pname">Numele sau inițialele (opțional)</label><input type="text" id="pname" value="${esc(me.name ?? myName)}" placeholder="ex. Ana P."></div></div>`;

  if (m.collect) {
    const props = Object.entries(S.proposals || {}).sort((a, b) => a[1].at - b[1].at);
    h += `<div class="card stack"><h2>Propuneți caracteristici</h2>
      <p class="muted small">Ce caracteristici ar trebui să aibă serviciul? Scrieți câte una pe rând. Formatorul le va selecta pe cele care intră în chestionar.</p>
      <form id="pf" class="row"><input type="text" id="ptext" maxlength="90" placeholder="ex. acces la materiale după curs" style="flex:1"><button class="primary">Trimite</button></form>
      <div>${props.length ? props.map(([id, p]) => `<div class="prop"><span>${esc(p.text)}</span>${p.by === clientId ? `<button class="ghost small danger" data-delp="${id}">șterge</button>` : ''}</div>`).join('') : '<p class="muted small">Încă nu există propuneri.</p>'}</div></div>`;
  }

  if (m.open && attrs.length) {
    if (me.done) {
      h += `<div class="card" style="text-align:center;padding:30px"><h2>Mulțumim! Răspunsurile au fost înregistrate.</h2><p class="muted">Ați răspuns la ${doneCount} din ${attrs.length} caracteristici.</p><button id="edit">Modific răspunsurile</button></div>`;
    } else {
      h += `<div class="card"><div class="row" style="justify-content:space-between"><b>Progres</b><span class="muted small">${doneCount} / ${attrs.length}</span></div><div class="progress" style="margin-top:6px"><div style="width:${attrs.length ? doneCount / attrs.length * 100 : 0}%"></div></div></div>`;
      attrs.forEach((a, i) => {
        const x = ans[a.id] || {};
        const complete = x.f != null && x.d != null;
        h += `<div class="card attr-card ${complete ? 'done' : ''}"><div class="attr-head"><span class="attr-num">${i + 1}</span><h3 style="margin:0">${esc(a.name)}</h3>${complete ? '<span class="badge" style="margin-left:auto">✓</span>' : ''}</div>
          <div class="q"><div class="qlabel"><span class="tag">Dacă există</span>${esc(a.f)}</div><div class="seg">${ANS.map((t, k) => `<button data-a="${a.id}" data-w="f" data-v="${k}" class="${x.f === k ? 'on' : ''}">${t}</button>`).join('')}</div></div>
          <div class="q"><div class="qlabel"><span class="tag">Dacă lipsește</span>${esc(a.d)}</div><div class="seg">${ANS.map((t, k) => `<button data-a="${a.id}" data-w="d" data-v="${k}" class="${x.d === k ? 'on' : ''}">${t}</button>`).join('')}</div></div></div>`;
      });
      h += `<div class="row" style="justify-content:flex-end"><button class="primary" id="finish" ${doneCount < attrs.length ? 'disabled title="Răspundeți la toate întrebările"' : ''}>Trimite răspunsurile</button></div>`;
    }
  } else if (!m.collect) {
    h += `<div class="card empty"><h3>Chestionarul nu este deschis încă</h3><p>Pagina se actualizează automat când formatorul îl deschide.</p></div>`;
  }

  if (m.showResults) h += `<div class="card stack"><h2>Rezultatele grupului</h2>${resultsSummaryHTML(computeStats(S), false)}</div>`;
  h += `</div>`;
  $('#app').innerHTML = h;

  const saveName = () => { const v = $('#pname').value.trim(); lsSet('kano_name', v); if ((me.name || '') !== v) store.update('sessions/' + code + '/responses/' + clientId, { name: v }); };
  $('#pname').oninput = debounce(saveName, 500);
  $$('.seg button').forEach(b => b.onclick = () => {
    const p = 'sessions/' + code + '/responses/' + clientId;

  const ed = $('#edit'); if (ed) ed.onclick = () => store.update('sessions/' + code + '/responses/' + clientId, { done: false });
  const pf = $('#pf'); if (pf) pf.onsubmit = e => { e.preventDefault(); const t = $('#ptext').value.trim(); if (!t) return; store.set('sessions/' + code + '/proposals/' + store.newKey(), { text: t.slice(0, 90), by: clientId, at: Date.now() }); $('#ptext').value = ''; };
  $$('[data-delp]').forEach(b => b.onclick = () => store.remove('sessions/' + code + '/proposals/' + b.dataset.delp));
}

// ================= REZULTATE (componente) =================
const pct = (a, n) => n ? Math.round(a / n * 100) : 0;
const fmt = v => v == null ? '—' : v.toFixed(2);
const legendHTML = (keys = CK) => `<div class="legend">${keys.map(k => `<span><i style="background:${CATS[k].c}"></i><b>${k}</b> ${CATS[k].n}</span>`).join('')}</div>`;

function predPill(pred) { return pred === '—' ? '—' : pred.split('/').map(k => `<span class="pill" style="background:${CATS[k].c}">${k}</span>`).join(' '); }

function resultsSummaryHTML(st, full) {
  const total = Object.keys(S.responses || {}).length;
  if (!st.length) return '<div class="empty">Nu există atribute.</div>';
  return `${legendHTML()}<div class="scroll-x" style="margin-top:10px"><table>
    <thead><tr><th>#</th><th>Atribut</th><th class="num">n</th>${full ? CK.map(k => `<th class="num">${k}</th>`).join('') : ''}<th>Distribuție</th><th>Predominant</th><th class="num" title="Coeficientul de satisfacție (A+P)/(A+P+M+I)">Better</th><th class="num" title="Coeficientul de insatisfacție −(P+M)/(A+P+M+I)">Worse</th></tr></thead>
    <tbody>${st.map((a, i) => `<tr><td><b>${i + 1}</b></td><td>${esc(a.name)}</td><td class="num">${a.n}</td>
      ${full ? CK.map(k => `<td class="num">${a.counts[k] || ''}</td>`).join('') : ''}
      <td><div class="bar">${CK.filter(k => a.counts[k]).map(k => `<span style="width:${pct(a.counts[k], a.n)}%;background:${CATS[k].c}" title="${CATS[k].n}: ${a.counts[k]} (${pct(a.counts[k], a.n)}%)">${pct(a.counts[k], a.n) >= 9 ? k : ''}</span>`).join('')}</div></td>
      <td>${predPill(a.pred)}</td><td class="num">${fmt(a.better)}</td><td class="num">${fmt(a.worse)}</td></tr>`).join('')}</tbody></table></div>
    <div class="grid2" style="margin-top:16px"><div>${scatterSVG(st)}</div>
    <div class="small muted"><h3 style="color:var(--ink)">Cum citim graficul Better–Worse</h3>
    <p><b>Better</b> = cât crește satisfacția dacă atributul există. <b>|Worse|</b> = cât crește nemulțumirea dacă lipsește.</p>
    <p>Sus-dreapta → <b>Performanță</b>: investiți proporțional. Jos-dreapta → <b>De bază</b>: obligatoriu, nu aduce laude. Sus-stânga → <b>Atractive</b>: diferențiatori. Jos-stânga → <b>Indiferente</b>: nu merită resurse.</p>
    ${total ? `<p>Respondenți: <b>${total}</b>. Răspunsurile <b>Q</b> (îndoielnice) indică întrebări neînțelese; <b>R</b> – segmente care vor opusul.</p>` : ''}</div></div>`;
}

function scatterSVG(st) {
  const W = 440, H = 400, L = 46, T = 16, R = 16, B = 46, w = W - L - R, h = H - T - B;
  const X = v => L + v * w, Y = v => T + (1 - v) * h;
  const pts = st.filter(a => a.better != null);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;font-family:inherit" role="img" aria-label="Grafic Better-Worse"><defs><linearGradient id="gpt" x1="0" x2="1"><stop offset="0" stop-color="#5b3df5"/><stop offset="1" stop-color="#e5368f"/></linearGradient></defs>
   <rect x="${L}" y="${T}" width="${w / 2}" height="${h / 2}" fill="#f59e0b22"/><rect x="${L + w / 2}" y="${T}" width="${w / 2}" height="${h / 2}" fill="#10b98122"/>
   <rect x="${L}" y="${T + h / 2}" width="${w / 2}" height="${h / 2}" fill="#94a3b822"/><rect x="${L + w / 2}" y="${T + h / 2}" width="${w / 2}" height="${h / 2}" fill="#2563eb1c"/>
   <rect x="${L}" y="${T}" width="${w}" height="${h}" fill="none" stroke="#cfc9bf"/>
   <line x1="${X(.5)}" y1="${T}" x2="${X(.5)}" y2="${T + h}" stroke="#cfc9bf" stroke-dasharray="4 4"/><line x1="${L}" y1="${Y(.5)}" x2="${L + w}" y2="${Y(.5)}" stroke="#cfc9bf" stroke-dasharray="4 4"/>
   <g font-size="12" font-weight="700"><text x="${L + 8}" y="${T + 18}" fill="#d97706">Atractive (A)</text><text x="${L + w - 8}" y="${T + 18}" text-anchor="end" fill="#059669">Performanță (P)</text>
   <text x="${L + 8}" y="${T + h - 8}" fill="#64748b">Indiferente (I)</text><text x="${L + w - 8}" y="${T + h - 8}" text-anchor="end" fill="#2563eb">De bază (M)</text></g>
   <g font-size="11" fill="#5f6876">${[0, .25, .5, .75, 1].map(v => `<text x="${X(v)}" y="${T + h + 16}" text-anchor="middle">${v}</text><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`).join('')}</g>
   <text x="${L + w / 2}" y="${H - 8}" text-anchor="middle" font-size="12" fill="#1d2430" font-weight="600">|Worse| – insatisfacție dacă lipsește</text>
   <text transform="translate(13 ${T + h / 2}) rotate(-90)" text-anchor="middle" font-size="12" fill="#1d2430" font-weight="600">Better – satisfacție dacă există</text>`;
  // atributele cu aceleași coordonate sunt grupate într-un singur punct, cu toate numerele
  const groups = new Map();
  st.forEach((a, i) => { if (a.better == null) return; const k = Math.abs(a.worse).toFixed(2) + '|' + a.better.toFixed(2);
    if (!groups.has(k)) groups.set(k, { x: Math.abs(a.worse), y: a.better, items: [] }); groups.get(k).items.push({ a, i }); });
  for (const g of groups.values()) {
    const cx = X(g.x), cy = Y(g.y), lbl = g.items.map(o => o.i + 1).join(', '), multi = g.items.length > 1;
    const tw = multi ? Math.max(24, lbl.length * 6.6 + 12) : 24;
    const bx = Math.min(Math.max(cx - tw / 2, L + 1), L + w - tw - 1);
    s += `<g><title>${g.items.map(o => `${o.i + 1}. ${esc(o.a.name)}`).join('\n')}\nBetter ${fmt(g.y)}, Worse ${fmt(-g.x)}</title>
      <rect x="${bx}" y="${cy - 12}" width="${tw}" height="24" rx="12" fill="url(#gpt)" stroke="#fff" stroke-width="2"/>
      <text x="${bx + tw / 2}" y="${cy + 4}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">${lbl}</text></g>`;
  }
  if (!pts.length) s += `<text x="${L + w / 2}" y="${T + h / 2 - 10}" text-anchor="middle" fill="#5f6876" font-size="13">Încă nu există răspunsuri</text>`;
  return s + '</svg>';
}

function matrixHTML(a) {
  const T = tableOf(S);
  return `<table class="matrix"><tr><th></th><th colspan="5" style="color:var(--ink)">Dacă LIPSEȘTE (disfuncțional) →</th></tr>
   <tr><th style="color:var(--ink)">Dacă EXISTĂ ↓</th>${ANS.map(t => `<th>${t}</th>`).join('')}</tr>
   ${ANS.map((t, f) => `<tr><th style="text-align:right">${t}</th>${ANS.map((_, d) => { const k = T[f][d], c = a.mat[f][d];
     return `<td class="cell" style="background:${CATS[k].hex}${c ? '33' : '12'};color:${CATS[k].hex}"><span class="l">${k}</span><span class="c" style="color:var(--ink);opacity:${c ? 1 : .25}">${c}</span></td>`; }).join('')}</tr>`).join('')}</table>`;
}

  } else if (adminTab === 'prop') {
    const props = Object.entries(S.proposals || {}).sort((a, b) => a[1].at - b[1].at);
    body.innerHTML = `<div class="card"><p class="muted small">Bifați „Colectez propuneri de atribute” de mai sus ca participanții să poată trimite idei. Apoi transformați-le pe cele bune în atribute.</p>
      ${props.length ? props.map(([id, p]) => `<div class="prop"><span>${esc(p.text)}</span><button data-take="${id}">+ Atribut</button><button class="ghost danger" data-delp="${id}">✕</button></div>`).join('') : '<div class="empty">Nicio propunere încă.</div>'}</div>`;
    $$('[data-take]').forEach(b => b.onclick = () => { const p = S.proposals[b.dataset.take]; addAttr(p.text); store.remove('sessions/' + code + '/proposals/' + b.dataset.take); toast('Adăugat în chestionar'); });
    $$('[data-delp]').forEach(b => b.onclick = () => store.remove('sessions/' + code + '/proposals/' + b.dataset.delp));
  } else if (adminTab === 'set') {
    body.innerHTML = `<div class="card stack" style="max-width:720px">
      <div><label for="sT">Titlu</label><input type="text" id="sT" value="${esc(m.title)}"></div>
      <div><label for="sC">Context afișat participanților</label><textarea id="sC">${esc(m.context || '')}</textarea></div>
      <div><label for="sTab">Tabel de evaluare</label><select id="sTab">${Object.entries(TABLES).map(([k, t]) => `<option value="${k}" ${(m.table || 'curs') === k ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select>
        <p class="small muted">Rezultatele se recalculează imediat. Comparația dintre cele două tabele e un bun subiect de discuție.</p></div>
      <div class="row" style="border-top:1px solid var(--line);padding-top:14px"><button class="danger" id="resetR">Șterge toate răspunsurile</button><button class="danger" id="delS">Șterge sesiunea</button></div>
      <p class="small muted">Link de administrare (păstrați-l): <span class="linkbox" style="display:block;margin-top:4px">${esc(location.href)}</span></p></div>`;
    $('#sT').oninput = debounce(e => meta('title', e.target.value.trim()), 600);
    $('#sC').oninput = debounce(e => meta('context', e.target.value.trim()), 600);
    $('#sTab').onchange = e => meta('table', e.target.value);
    $('#resetR').onclick = () => { if (confirm('Ștergeți TOATE răspunsurile? Acțiunea nu poate fi anulată.')) store.remove('sessions/' + code + '/responses'); };
    $('#delS').onclick = () => { if (confirm('Ștergeți definitiv sesiunea?')) { store.remove('sessions/' + code); lsSet('kano_my', lsGet('kano_my', []).filter(x => x.code !== code)); location.href = '?prof'; } };
  }
}

function addAttr(name) {
  const attrs = sortedAttrs(S), order = attrs.length ? Math.max(...attrs.map(a => a.order || 0)) + 1 : 1;
  store.set('sessions/' + code + '/attrs/' + store.newKey(), { name, f: `Cum vi se pare faptul că există: ${name}?`, d: `Cum vi se pare faptul că nu există: ${name}?`, order });
}

function exportCSV() {
  const st = computeStats(S), T = tableOf(S), attrs = sortedAttrs(S);
  const rows = [['REZULTATE AGREGATE'], ['#', 'Atribut', 'n', ...CK, 'Predominant', 'Better', 'Worse']];
  st.forEach((a, i) => rows.push([i + 1, a.name, a.n, ...CK.map(k => a.counts[k]), a.pred, a.better == null ? '' : a.better.toFixed(3).replace('.', ','), a.worse == null ? '' : a.worse.toFixed(3).replace('.', ',')]));
  rows.push([], ['RĂSPUNSURI INDIVIDUALE'], ['Participant', 'Atribut', 'Funcțional (există)', 'Disfuncțional (lipsește)', 'Categorie']);
  Object.values(S.responses || {}).forEach((r, ri) => attrs.forEach(a => { const x = r.answers && r.answers[a.id]; if (x && x.f != null && x.d != null) rows.push([r.name || 'Participant ' + (ri + 1), a.name, ANS[x.f], ANS[x.d], T[x.f][x.d]]); }));
  download(`kano_${code}.csv`, toCSV(rows));
}
</script>
</body>
</html>
